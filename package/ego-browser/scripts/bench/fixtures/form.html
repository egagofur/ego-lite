<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bench Sign In</title>
  </head>
  <body>
    <main>
      <h1>Sign in</h1>
      <form action="/done.html" method="get">
        <div><label for="user">Email address</label><input id="user" name="user" type="email" /></div>
        <div><label for="pass">Password</label><input id="pass" name="pass" type="password" /></div>
        <div><label><input type="checkbox" name="remember" /> Remember me</label></div>
        <button type="submit">Sign in</button>
      </form>
      <p><a href="/app.html">Back to dashboard</a></p>
    </main>
  </body>
</html>
